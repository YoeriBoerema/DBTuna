packages:
  - packages/*
# CVE-2026-109461: Azure Identity has not yet updated its MSAL major range.
# DBTuna supports SQL/password and explicit NTLM, not Azure auth-code flows.
overrides:
  "@azure/msal-node": 7.1.0
allowBuilds:
  esbuild: false
  "@vscode/vsce-sign": false
  keytar: false
  oracledb: false
